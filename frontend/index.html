<!DOCTYPE html>
<html lang="pt-br">

<head>
	<meta charset="UTF-8">
	<title>FinTrack</title>
	<link rel="stylesheet" href="css/style.css">
</head>

<body onload="initDashboard()">
	<header class="navbar">
		<div class="nav-left">FinTrack</div>
		<ul class="nav-right">
			<li><a href="management.html">Gerenciamento</a></li>
			<li><a href="index.html" class="active">Dashboard</a></li>
			<li><a href="#" onclick="logout()">Logout</a></li>
		</ul>
	</header>

	<main>
		<h2>Resumo financeiro</h2>

		<div id="budget-list"></div>

		<div class="charts-container">
			<div class="card">
				<h3>Gastos por categoria</h3>
				<canvas id="category-chart"></canvas>
			</div>

			<div class="card">
				<h3>Resumo</h3>
				<canvas id="finance-chart"></canvas>
			</div>
		</div>
	</main>

	<div id="modal" class="modal hidden">
		<div class="modal-content">

			<div class="modal-header">
				<h3 id="modal-title"></h3>
				<button id="modal-close">✖</button>
			</div>

			<!-- abas -->
			<div class="modal-tabs">
				<button class="tab-btn active" data-tab="summary">Resumo</button>
				<button class="tab-btn" data-tab="expenses">Despesas</button>
				<button class="tab-btn" data-tab="items">Itens</button>
			</div>

			<div class="modal-body">

				<div id="tab-summary" class="tab-content active"></div>

				<div id="tab-expenses" class="tab-content">
					<table>
						<thead>
							<tr>
								<th>Data</th>
								<th>Item</th>
								<th>Valor</th>
							</tr>
						</thead>
						<tbody id="expenses-body"></tbody>
					</table>
				</div>

				<div id="tab-items" class="tab-content">
					<table>
						<thead>
							<tr>
								<th>Item</th>
								<th>Total gasto</th>
							</tr>
						</thead>
						<tbody id="items-body"></tbody>
					</table>
				</div>

			</div>

		</div>
	</div>

	<script src="js/utils.js"></script>
	<script src="js/api.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
	<script src="js/dashboard.js"></script>
</body>

</html>
